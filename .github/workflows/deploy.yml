name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

# GitHub Actions 권한 설정 - gh-pages 배포에 필수
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Generate static files
        run: npm run generate
        env:
          NUXT_PUBLIC_WEB3FORMS_KEY: ${{ secrets.NUXT_PUBLIC_WEB3FORMS_KEY }}
          NUXT_PUBLIC_CHANNEL_PLUGIN_KEY: ${{ secrets.NUXT_PUBLIC_CHANNEL_PLUGIN_KEY }}
          NUXT_PUBLIC_CALENDLY_URL: ${{ secrets.NUXT_PUBLIC_CALENDLY_URL }}
          NUXT_PUBLIC_SUPABASE_URL: https://jjqobumitamcyvfgnacf.supabase.co
          NUXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NUXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .output/public
          force_orphan: true
          cname: evegdev.com

      # 바뀐 인사이트 글 URL 을 IndexNow(Bing·네이버 등)로 알린다. 색인 알림은 배포의 부가 단계라
      # 실패해도 배포 결과는 성공으로 남긴다 (실패는 이 단계에 경고로만 표시된다)
      - name: Notify search engines (IndexNow)
        continue-on-error: true
        timeout-minutes: 10
        env:
          INDEXNOW_BEFORE: ${{ github.event.before }}
          INDEXNOW_AFTER: ${{ github.sha }}
        run: node scripts/indexnow.mjs
